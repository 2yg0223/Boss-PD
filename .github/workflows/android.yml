name: Build APK

on:
  push:
    branches: [ master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Use fixed debug signing key
        run: |
          mkdir -p ~/.android
          cp .github/debug.keystore ~/.android/debug.keystore

      - name: Build debug APK
        run: ./gradlew android:assembleDebug

      - name: Show APK signing certificate
        run: |
          APKSIGNER=$(ls -d $ANDROID_HOME/build-tools/*/apksigner | sort -V | tail -1)
          for f in android/build/outputs/apk/debug/*.apk; do
            echo "$f"
            "$APKSIGNER" verify --print-certs "$f" | grep -i "SHA-256"
          done

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Boss-PD-apk
          path: android/build/outputs/apk/debug/*.apk
